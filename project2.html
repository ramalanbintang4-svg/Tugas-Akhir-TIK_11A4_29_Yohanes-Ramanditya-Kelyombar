<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 2 - Kalkulator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #fef08a;
            color: #1e293b;
        }
        .box-container {
            background-color: #fefcbf;
            border-radius: 12px;
            border: 2px solid #eab308;
            padding: 35px;
        }
        .btn-dark-custom {
            background-color: #1e293b;
            color: white;
            font-weight: 600;
            border: none;
        }
        .btn-dark-custom:hover {
            background-color: #0f172a;
        }
        /* Style pembungkus kalkulator agar presisi */
        .calc-wrapper {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 20px;
            border: 2px solid #eab308;
            max-width: 320px;
            margin: 0 auto;
        }
        /* Layar kalkulator */
        .calc-screen {
            width: 100%;
            height: 55px;
            background-color: #fef08a;
            color: #0f172a;
            text-align: right;
            padding: 10px 15px;
            font-size: 1.6rem;
            border-radius: 8px;
            border: 2px solid #eab308;
            margin-bottom: 15px;
            font-weight: bold;
        }
        /* Ukuran tombol seragam agar tidak menindih */
        .calc-btn {
            width: 100%;
            height: 52px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 8px;
            border: 1px solid #eab308;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="container my-5 col-lg-7">
        <div class="box-container shadow-sm">
            <h2 class="fw-bold text-dark mb-2">Nama Project: KALKULATOR</h2>
            <p class="text-muted mb-4">Deskripsi Singkat Project: Aplikasi hitung interaktif sederhana berbasis JavaScript.</p>
            
            <!-- Struktur Grid Kalkulator yang Baru & Rapi -->
            <div class="calc-wrapper shadow-sm">
                <input type="text" id="display" class="calc-screen" readonly value="0">
                
                <!-- Baris 1: Kontrol & Operasi -->
                <div class="row g-2 mb-2">
                    <div class="col-3"><button class="btn btn-danger calc-btn" onclick="clearDisplay()">C</button></div>
                    <div class="col-3"><button class="btn btn-warning calc-btn text-dark" onclick="appendOp('/')">/</button></div>
                    <div class="col-3"><button class="btn btn-warning calc-btn text-dark" onclick="appendOp('*')">x</button></div>
                    <div class="col-3"><button class="btn btn-warning calc-btn text-dark" onclick="appendOp('-')">-</button></div>
                </div>
                
                <!-- Baris 2: Angka 7, 8, 9 dan Tambah -->
                <div class="row g-2 mb-2">
                    <div class="col-3"><button class="btn btn-light calc-btn" onclick="appendNum('7')">7</button></div>
                    <div class="col-3"><button class="btn btn-light calc-btn" onclick="appendNum('8')">8</button></div>
                    <div class="col-3"><button class="btn btn-light calc-btn" onclick="appendNum('9')">9</button></div>
                    <div class="col-3"><button class="btn btn-warning calc-btn text-dark" onclick="appendOp('+')">+</button></div>
                </div>
                
                <!-- Baris 3: Angka 4, 5, 6 -->
                <div class="row g-2 mb-2">
                    <div class="col-3"><button class="btn btn-light calc-btn" onclick="appendNum('4')">4</button></div>
                    <div class="col-3"><button class="btn btn-light calc-btn" onclick="appendNum('5')">5</button></div>
                    <div class="col-3"><button class="btn btn-light calc-btn" onclick="appendNum('6')">6</button></div>
                    <!-- Sengaja dikosongkan agar layout seimbang dan fungsional -->
                    <div class="col-3"><button class="btn btn-secondary calc-btn" disabled>&plusmn;</button></div>
                </div>
                
                <!-- Baris 4: Angka 1, 2, 3 dan Hasil Sama Dengan -->
                <div class="row g-2 mb-2">
                    <div class="col-3"><button class="btn btn-light calc-btn" onclick="appendNum('1')">1</button></div>
                    <div class="col-3"><button class="btn btn-light calc-btn" onclick="appendNum('2')">2</button></div>
                    <div class="col-3"><button class="btn btn-light calc-btn" onclick="appendNum('3')">3</button></div>
                    <div class="col-3"><button class="btn btn-success calc-btn" onclick="runCalculation()">=</button></div>
                </div>

                <!-- Baris 5: Angka 0 dan Titik Desimal -->
                <div class="row g-2">
                    <div class="col-6"><button class="btn btn-light calc-btn" onclick="appendNum('0')">0</button></div>
                    <div class="col-6"><button class="btn btn-light calc-btn" onclick="appendNum('.')">.</button></div>
                </div>
            </div>

            <div class="text-center mt-5">
                <a href="index.html" class="btn btn-dark-custom px-4">Kembali ke Halaman Utama</a>
            </div>
        </div>
    </div>

    <!-- Logika Javascript Sistem Hitung -->
    <script>
        let display = document.getElementById('display');
        let resetOnNext = false;

        function appendNum(num) {
            if (display.value === '0' || resetOnNext) {
                display.value = num;
                resetOnNext = false;
            } else {
                display.value += num;
            }
        }

        function appendOp(op) {
            resetOnNext = false;
            // Mencegah double operator berturut-turut agar tidak crash
            let lastChar = display.value.slice(-1);
            if (['+', '-', '*', '/'].includes(lastChar)) {
                display.value = display.value.slice(0, -1) + op;
            } else {
                display.value += op;
            }
        }

        function clearDisplay() {
            display.value = '0';
        }

        function runCalculation() {
            try {
                // Menggunakan fungsi evaluasi matematika basic javascript
                display.value = eval(display.value);
                resetOnNext = true;
            } catch (err) {
                display.value = 'Error';
                resetOnNext = true;
            }
        }
        console.log("Kalkulator Layout Grid Baru Berhasil Diperbaiki.");
    </script>
</body>
</html>
